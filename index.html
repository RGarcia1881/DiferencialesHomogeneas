<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDO Lab · Ecuaciones homogéneas de 2.º orden</title>
<script>
  // El tema se aplica antes de pintar para evitar parpadeos. Por defecto: claro (sin modo automático).
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="#resolver"><span class="logo">y″</span><span>EDO Lab</span></a>

  <nav class="tabs" aria-label="Secciones">
    <span class="ind" aria-hidden="true"></span>
    <a href="#resolver" data-view="resolver">Resolver</a>
    <a href="#como-funciona" data-view="como-funciona">¿Cómo funciona?</a>
  </nav>

  <button id="theme" class="icon-btn" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
    <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div id="file-warning" class="warning" hidden>
  Este proyecto usa módulos ES: ábrelo con un servidor local, por ejemplo
  <code>python3 -m http.server 8000</code>, y entra a <code>http://localhost:8000</code>.
</div>

<main>
  <!-- ═════ Vista 1: Resolver ═════ -->
  <section id="view-resolver" class="view view-solve" hidden>
    <div class="col">
      <article class="win" style="--w:0">
        <div class="win-bar"><i></i><i></i><i></i><span class="win-title">Ecuación</span></div>
        <form class="win-body" id="form" novalidate>
          <p class="hint">Ingresa los coeficientes de <b>ay″ + by′ + cy = 0</b></p>
          <div class="eq">
            <input id="a" type="number" step="any" value="1" aria-label="a"><span>y″</span><span class="op">+</span>
            <input id="b" type="number" step="any" value="2" aria-label="b"><span>y′</span><span class="op">+</span>
            <input id="c" type="number" step="any" value="5" aria-label="c"><span>y</span><span class="op">=</span><span>0</span>
          </div>
          <div id="error" role="alert"></div>
          <button type="submit" class="primary">Resolver</button>
        </form>
      </article>

    </div>

    <article class="win" style="--w:1">
      <div class="win-bar"><i></i><i></i><i></i><span class="win-title">Procedimiento</span></div>
      <div class="win-body scroll math" id="steps"></div>
    </article>

  </section>

  <!-- ═════ Vista 2: ¿Cómo funciona? ═════ -->
  <section id="view-how" class="view view-how" hidden>
    <article class="win" style="--w:0">
      <div class="win-bar"><i></i><i></i><i></i><span class="win-title">Temas</span></div>
      <div class="win-body scroll topics" id="how-list"></div>
    </article>

    <article class="win" style="--w:1">
      <div class="win-bar"><i></i><i></i><i></i><span class="win-title">Teoría ↔ Código</span>
        <span class="kbd-hint">usa ← → para navegar</span></div>
      <div class="detail" id="how-detail"></div>
    </article>
  </section>
</main>

<script>
  if (location.protocol === "file:") document.getElementById("file-warning").hidden = false;
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
